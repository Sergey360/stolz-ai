  <text x="82" y="56" fill="#666a68" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">TAAK</text><text x="82" y="79" fill="#11110f" font-family="Georgia, serif" font-size="19" font-weight="700">Een concrete vraag</text><path d="M82 101h246" stroke="#cbc8c0"/>
  <text x="82" y="148" fill="#666a68" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">ÉÉN ROUTE</text><text x="82" y="174" fill="#11110f" font-family="Courier New, monospace" font-size="19" font-weight="700">stolz-route</text><text x="82" y="194" fill="#666a68" font-family="Arial, sans-serif" font-size="13">één gericht onderwerp</text><path d="M82 217h246" stroke="#cbc8c0"/>
  <text x="82" y="240" fill="#666a68" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">CONTROLEREN</text><text x="82" y="266" fill="#11110f" font-family="Georgia, serif" font-size="18" font-weight="700">Vereiste checks blijven</text><path d="M82 289h246" stroke="#cbc8c0"/>
