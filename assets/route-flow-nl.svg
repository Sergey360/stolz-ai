<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-labelledby="title desc">
  <title id="title">De route van STOLZ A.I.</title><desc id="desc">Een taak volgt één gerichte route, behoudt de vereiste verificatie en levert een betrouwbare uitkomst.</desc>
  <rect width="360" height="420" fill="#f6f3ec"/><path d="M32 24h296M32 396h296" stroke="#cbc8c0"/><path d="M52 54v294" stroke="#cbc8c0" stroke-width="2"/><path d="M52 54v186" stroke="#e04a2f" stroke-width="3"/>
