name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run benchmark:check
      - run: npm run benchmark:v2:check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/reads-navigation.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/build-check-invalidation.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/quiet-wait-transition.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/v014-sol-xhigh-reads-navigation.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/v014-sol-xhigh-build-check-invalidation.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/v014-sol-xhigh-multi-step-state-transition.json --check
      - run: npm run benchmark:v3 -- --verify-report reports/benchmark-v3/real/v014-astra-medium-multi-step-state-transition.json --check
      - run: npm run smoke:public-package
      - run: npm pack --dry-run --json --ignore-scripts
      - run: npm pack --ignore-scripts
      # Documentation on main can evolve without replacing immutable release bytes.
      # Check the published asset on every run; tags must also reproduce it exactly.
      - name: Verify the immutable published archive
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p published-release
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/Sergey360/stolz-ai/releases/download/v${version}/stolz-ai-${version}.tgz" \
            --output "published-release/stolz-ai-${version}.tgz"
          (cd published-release && sha256sum --check "../.github/releases/stolz-ai-${version}.tgz.sha256")
      - name: Verify tagged archive reproduction
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          sha256sum --check ".github/releases/stolz-ai-${version}.tgz.sha256"
